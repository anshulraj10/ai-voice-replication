<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice Cloning App</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styling -->
    <style>
        body {
            background: #f5f7fa;
            font-family: 'Roboto', sans-serif;
            padding-top: 40px;
        }
        .container {
            max-width: 800px;
        }
        h1 {
            margin-bottom: 30px;
            font-weight: bold;
        }
        .card {
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            background: white;
        }
        .btn-primary {
            width: 100%;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .btn-group {
            margin-top: 10px;
        }
        #loading {
            display: none;
            margin-top: 20px;
        }
    </style>

    <script src="/static/recorder.js"></script>
</head>
<body>

<div class="container">
    <h1 class="text-center text-primary">🔊 OpenVoice - Voice Cloning App</h1>

    <div class="card">
        <form id="voiceForm" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Enter Text</label>
                <input type="text" name="text" class="form-control" placeholder="Type your text..." required>
            </div>

            <div class="mb-3">
                <label class="form-label">Upload Audio OR Record</label>
                <input class="form-control" type="file" id="audio_file" name="audio" accept="audio/*">
            
                <div class="btn-group w-100 mt-2">
                    <button type="button" id="startBtn" class="btn btn-outline-primary" onclick="startRecording()">🎙️ Start Recording</button>
                    <button type="button" id="stopBtn" class="btn btn-outline-danger" onclick="stopRecording()" disabled>🛑 Stop Recording</button>
                </div>
            
                <div id="recordingStatus" class="text-danger text-center mt-2" style="display:none;">
                    Recording... <span id="timer" style="font-weight:bold;">00:00</span>
                </div>
            
                <div id="recordingStatusStopped" class="text-danger text-center mt-2" style="display:none;">
                    Recorded <span id="timerStopped" style="font-weight:bold;">00:00</span>
                </div>
            
                <input type="hidden" name="audio_type" id="audio_type" value="upload">
            </div>

            <div class="mb-3">
                <label class="form-label">Select Model</label>
                <select class="form-select" name="model_version" id="model_version" onchange="updateOptions()">
                    <option value="v1">OpenVoice V1 (Style)</option>
                    <option value="v2">OpenVoice V2 (Accent)</option>
                </select>
            </div>

            <div id="v1_options" class="mb-3">
                <label class="form-label">Select Style (V1)</label>
                <select class="form-select" name="style">
                    <option value="default">Default</option>
                    <option value="friendly">Friendly</option>
                    <option value="cheerful">Cheerful</option>
                    <option value="excited">Excited</option>
                    <option value="sad">Sad</option>
                    <option value="angry">Angry</option>
                    <option value="terrified">Terrified</option>
                    <option value="shouting">Shouting</option>
                    <option value="whispering">Whispering</option>
                </select>
            </div>

            <div id="v2_options" class="mb-3" style="display:none;">
                <label class="form-label">Select Accent (V2)</label>
                <select class="form-select" name="language">
                    <option value="EN-US">American (EN_US)</option>
                    <option value="EN-BR">British (EN_BR)</option>
                    <option value="EN_INDIA">Indian (EN_INDIA)</option>
                    <option value="EN-AU">Australian (EN_AU)</option>
                    <option value="EN-Default">Default (EN_DEFAULT)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Speed</label>
                <input type="number" step="0.1" class="form-control" name="speed" value="1.0" min="0.3" max="3.5">
            </div>

            <button type="submit" class="btn btn-primary">Generate Voice</button>
        </form>
    </div>

    <div id="loading" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Generating...</span>
        </div>
        <p class="text-muted mt-2">Generating your voice, please wait...</p>
    </div>

    <div id="result" class="card mt-4" style="display:none;">
        <h3 class="text-success">Your Generated Voice:</h3>
        <audio id="audioPlayer" controls></audio>
        <a id="downloadLink" class="btn btn-success mt-3" href="#" download>Download Audio</a>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function updateOptions() {
    const model = document.getElementById('model_version').value;
    if (model === 'v1') {
        document.getElementById('v1_options').style.display = 'block';
        document.getElementById('v2_options').style.display = 'none';
    } else {
        document.getElementById('v1_options').style.display = 'none';
        document.getElementById('v2_options').style.display = 'block';
    }
}

document.getElementById('voiceForm').onsubmit = async function(event) {
    event.preventDefault();

    const formData = new FormData(this);

    // Check if audio is uploaded or recorded
    if (!formData.get('audio').name) {
        alert("Please upload or record an audio first!");
        return;
    }

    // Show spinner and hide result
    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').style.display = 'none';

    const response = await fetch('/generate', {
        method: 'POST',
        body: formData
    });

    const result = await response.json();
    const audio_url = result.audio_url;

    // Hide spinner and show result
    document.getElementById('loading').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    document.getElementById('audioPlayer').src = audio_url;
    document.getElementById('downloadLink').href = audio_url;
};
</script>

</body>
</html>
